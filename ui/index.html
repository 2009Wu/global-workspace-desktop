<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src https:; connect-src 'self' https://tiles.openfreemap.org https://services.arcgisonline.com; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>全球情报工作台</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="command.css"></head>
<body>
<header><div class="logo" aria-hidden="true">◎</div><strong data-t="title"></strong><span class="version" id="headVersion"></span><div class="push"></div><time id="clock"></time><button id="coffee" data-t="coffee"></button><select id="language" aria-label="Language"></select><button id="settings" data-t="settings"></button></header>
<main>
<aside><div class="navlabel" data-t="layer"></div><nav id="layers"></nav><div class="push"></div><button id="savedTab" data-t="saved"></button><button id="sourcesTab" data-t="sourceState"></button></aside>
<div id="workspace">
<section id="mapPane" class="panel"><div class="panelhead"><i></i><h2 data-t="map"></h2><span id="mapScope"></span><div class="push"></div><button class="pop" data-view="map">⧉</button></div>
<div class="filterline"><select id="region"></select><select id="layerSelect"></select><button id="resetMap" title="⌖">⌖</button><select id="imageryMode" hidden><option value="mosaic"></option><option value="daily"></option></select><input type="date" id="imagery" hidden></div>
<div id="conflictTopics" hidden><button id="hormuzTopic"></button><button id="ukraineTopic"></button></div>
<div id="mapWrap"><div id="map"></div><div id="mapAlerts"><button id="streetStatus" hidden></button><button id="imageryRetry" hidden></button></div><div id="mapStats"></div></div><div id="legend"></div></section>
<div id="splitX" class="divider" role="separator" tabindex="0"></div>
<div class="right"><section id="listPane" class="panel"><div class="panelhead"><i></i><h2 data-t="events"></h2><span id="counter"></span><div class="push"></div><button id="refresh" class="compact">⟳</button><button class="pop" data-view="list">⧉</button></div><div class="searchline"><input id="query" type="search"><select id="level"></select></div><div id="rows"></div></section>
<div id="splitY" class="divider" role="separator" tabindex="0"></div>
<section id="briefPane" class="panel"><div class="panelhead"><i></i><h2 data-t="brief"></h2><div class="push"></div><button class="pop" data-view="brief">⧉</button></div><div id="briefBody" class="scroll"></div></section></div></div></main>
<footer><span class="connection" id="feedStatus"></span><div class="push"></div><span id="coords"></span><span>WGS 84</span></footer>
<dialog id="dialog"><div class="panelhead"><h2 id="dialogTitle"></h2><div class="push"></div><button id="dismissDialog">×</button></div><div id="dialogBody"></div></dialog>
<article id="toast" hidden></article><div id="notice" role="status" hidden></div>
<script src="boot.js"></script></body></html>

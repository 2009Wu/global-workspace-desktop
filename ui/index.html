<!doctype html>
<html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data:; media-src https:; worker-src 'self'; connect-src 'self' https://a.tile.opentopomap.org https://s3.amazonaws.com https://server.arcgisonline.com https://gibs.earthdata.nasa.gov blob: https://public.api.bsky.app wss://jetstream2.us-east.bsky.network https://tiles.openfreemap.org https://services.arcgisonline.com https://atlas.ripe.net; object-src 'none'; frame-src 'none'; base-uri 'none'"><title>世界情报收集处</title><link rel="stylesheet" href="vendor/leaflet.css"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="command.css"><link rel="stylesheet" href="globe.css"><link rel="stylesheet" href="votes.css"></head>
<body>
<header><div class="logo" aria-hidden="true">◎</div><strong data-t="title"></strong><span class="version" id="headVersion"></span><div class="push"></div><time id="clock"></time><button id="refreshAll" disabled data-t="refreshAll"></button><button id="coffee" data-t="coffee"></button><select id="language" aria-label="Language"></select><button id="settings" data-t="settings"></button></header>
<main>
<aside><div class="navlabel" data-t="layer"></div><nav id="layers"></nav><div class="push"></div><button id="savedTab" data-t="saved"></button><button id="sourcesTab" data-t="sourceState"></button></aside>
<div id="workspace">
<section id="mapPane" class="panel"><div class="panelhead"><i></i><h2 data-t="map"></h2><span id="mapScope"></span><div class="push"></div><button id="voteOpen" data-t="voteMap"></button><button class="pop" data-view="map">⧉</button></div>
<div class="filterline"><select id="region"></select><select id="layerSelect"></select><button id="countryOpen" data-t="countryOverview"></button><button id="resetMap" title="⌖">⌖</button><select id="imageryMode" hidden><option value="mosaic"></option><option value="daily"></option></select><input type="date" id="imagery" hidden></div>
<div id="conflictTopics" hidden><button id="hormuzTopic"></button><button id="ukraineTopic"></button></div>
<div id="mapWrap"><div id="map"></div><div id="mapAlerts"><button id="streetStatus" hidden></button><button id="imageryRetry" hidden></button></div><div id="mapStats"></div></div><div id="mapFoot"><div id="legend"></div><span id="topoBoundaryKey" data-t="topoBoundaryKey" hidden></span><div id="mapActions"><button id="aerialToggle" hidden></button><button id="roadsToggle" hidden></button><button id="buildingsToggle" hidden aria-pressed="false"></button><button id="streetView" data-t="streetView" aria-pressed="false"></button><button id="sceneToggle" aria-pressed="false">3D</button></div></div></section>
<div id="splitX" class="divider" role="separator" tabindex="0"></div>
<div class="right"><section id="listPane" class="panel"><div class="panelhead"><i></i><h2 data-t="events"></h2><span id="counter"></span><div class="push"></div><button id="refresh" class="compact">⟳</button><button class="pop" data-view="list">⧉</button></div><div class="searchline"><input id="query" type="search"><label class="type-filter"><span data-t="eventTypeLabel"></span><select id="eventType"></select></label><select id="level"></select><button type="button" id="publicationSort" aria-pressed="false" data-t="publicationSort"></button></div><div id="rows"></div></section>
<div id="splitY" class="divider" role="separator" tabindex="0"></div>
<section id="briefPane" class="panel"><div class="panelhead"><i></i><h2 data-t="brief"></h2><div class="push"></div><button class="pop" data-view="brief">⧉</button></div><div id="briefBody" class="scroll"></div></section></div></div></main>
<article id="voteView" hidden>
<div class="vote-heading"><div class="vote-selectors"><label for="voteSelect" data-t="resolution"></label><input type="search" id="voteQuery"><select id="voteSelect"></select><button id="voteHistoryOpen" data-t="voteHistory" disabled></button></div><h1 id="voteHeadline"></h1><div id="voteInfo"></div></div>
<div id="ballotMap"></div>
<div class="vote-bottom"><div id="voteLegend"></div><div class="vote-detail"><select id="voteNation" aria-label="Country"></select><strong id="voteResult" aria-live="polite"></strong><span id="voteLinks"><a id="voteRecordLink" data-t="voteRecord"></a><a id="voteTextLink" data-t="voteText"></a></span></div><div class="vote-credits"><span>United Nations Dag Hammarskjöld Library · Natural Earth</span><span id="voteStatus"></span></div></div></article>
<article id="countryProfile" hidden><div class="country-hero"><div><h1 id="profileHeading"></h1><a id="profileCapital"></a> <time id="profileClock"></time></div><button id="profilePin" aria-pressed="false"></button></div><div id="profileBody"></div></article>
<footer><span class="connection" id="feedStatus"></span><div class="push"></div><span id="coords"></span><span>WGS 84</span></footer>
<dialog id="dialog"><div class="panelhead"><h2 id="dialogTitle"></h2><div class="push"></div><button id="dismissDialog">×</button></div><div id="dialogBody"></div></dialog>
<article id="toast" hidden></article><div id="notice" role="status" hidden></div>
<script src="boot.js"></script></body></html>
